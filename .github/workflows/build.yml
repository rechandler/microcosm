name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3 x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64  # newest installed Visual Studio
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: DSP test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\Macrocosm_artefacts\Release\VST3\Macrocosm.vst3" dist\
          Copy-Item "build\Macrocosm_artefacts\Release\Standalone\Macrocosm.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath Macrocosm-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Macrocosm-Windows-x64
          path: Macrocosm-Windows-x64.zip
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          # Out of process, so a crash is reported with a stack trace.
          .\pluginval\pluginval.exe --strictness-level 8 --timeout-ms 600000 --output-dir pluginval-logs "build\Macrocosm_artefacts\Release\VST3\Macrocosm.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pluginval-logs-windows
          path: pluginval-logs

  macos:
    name: macOS (VST3 + AU, Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel -- -quiet
      - name: DSP test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify universal binary
        run: |
          lipo -info "build/Macrocosm_artefacts/Release/VST3/Macrocosm.vst3/Contents/MacOS/Macrocosm"
          lipo -info "build/Macrocosm_artefacts/Release/AU/Macrocosm.component/Contents/MacOS/Macrocosm"
      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - "build/Macrocosm_artefacts/Release/VST3/Macrocosm.vst3"
          codesign --force --deep -s - "build/Macrocosm_artefacts/Release/AU/Macrocosm.component"
          codesign --force --deep -s - "build/Macrocosm_artefacts/Release/Standalone/Macrocosm.app"
      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Macrocosm_artefacts/Release/AU/Macrocosm.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Mcsm Mcra
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --timeout-ms 600000 "build/Macrocosm_artefacts/Release/VST3/Macrocosm.vst3"
      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Macrocosm_artefacts/Release/VST3/Macrocosm.vst3 dist/
          cp -R build/Macrocosm_artefacts/Release/AU/Macrocosm.component dist/
          cp -R build/Macrocosm_artefacts/Release/Standalone/Macrocosm.app dist/
          cd dist && ditto -c -k --keepParent . ../Macrocosm-macOS-Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Macrocosm-macOS-Universal
          path: Macrocosm-macOS-Universal.zip

  linux:
    name: Linux (VST3, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libxcomposite-dev libxext-dev xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: DSP test
        run: ctest --test-dir build --output-on-failure
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 8 --validate-in-process --timeout-ms 600000 build/Macrocosm_artefacts/Release/VST3/Macrocosm.vst3

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
